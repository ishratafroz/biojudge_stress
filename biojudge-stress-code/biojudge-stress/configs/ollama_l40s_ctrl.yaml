# Same run, same cache, same models as configs/ollama_l40s.yaml, extended with the four control
# conditions the design calls for (2026-10-14). Every call the main run already made is reused from
# runs/local/cache.sqlite, so this config only adds the control verdicts.
#
#   bash scripts/serve_l40s.sh 12
#   OLLAMA_API_KEY=EMPTY .venv_linux/bin/python -m biojudge.run \
#       --config configs/ollama_l40s_ctrl.yaml --stages perturb,judge
#
# What the four conditions answer:
#   placebo        a length-matched sentence pair with no cue -> the floor every ASR is read against
#   consensus      a cue the normaliser prompt never names   -> does the defence generalise?
#   attacks_sym    the same five edits on the correct answer  -> does a cue help whoever carries it?
#   base_strip     markup + bracketed text removed, no rewrite -> what does the LLM rewrite add?
run_name: local
out_dir: runs
seed: 2026

data:
  domains:
    literature:   {source: pubmedqa,      n: 25}
    clinical:     {source: medqa,         n: 25}
    pharmacology: {source: medmcqa_pharm, n: 25}
  distractor: hard

_ollama: &ol
  provider: openai
  base_url: http://127.0.0.1:11436/v1
  api_key_env: OLLAMA_API_KEY

models:
  llama:   {<<: *ol, model: "llama3.2:3b",    family: llama,   display: Llama-3.2-3B}
  qwen:    {<<: *ol, model: "qwen2.5:3b",     family: qwen,    display: Qwen2.5-3B}
  gemma:   {<<: *ol, model: "gemma2:2b",      family: gemma,   display: Gemma-2-2B, merge_system: true}
  mistral: {<<: *ol, model: "ministral-3:3b", family: mistral, display: Ministral-3-3B}
  phi:     {<<: *ol, model: "phi4-mini",      family: phi,     display: Phi-4-mini}

roles:
  generators: [llama, qwen, gemma, mistral]
  judges:     [llama, qwen, gemma, mistral]
  utility: phi

experiment:
  protocols: [base_raw, debias_raw, base_norm, debias_norm, base_strip]
  attacks: [authority, citation, format, confidence, injection, combo]
  attacks_control: [placebo, consensus]
  control_protocols: [base_raw, debias_raw, base_norm, debias_norm]
  attacks_sym: [authority, citation, format, confidence, injection]
  sym_protocols: [base_raw]
  attack_pairs_per_item: 2
  pad_mode: llm
  pad_ratio: 2.5
  select: {enabled: true, protocols: [base_raw, debias_norm]}

runtime:
  concurrency: 48
  request_timeout: 300
  max_api_retries: 4
  interleave_models: true

analysis:
  bootstrap: 2000

# Environment of record for the manuscript's setup section (read by biojudge.report).
provenance:
  ollama_version: "0.32.1"
  engine: "Ollama 0.32.1, llama.cpp back end, flash attention, q8_0 KV cache, 8192-token slots"
  host_judge: "Linux host, 4x NVIDIA L40S (46 GB; GPUs 0,2,3 used), Intel Xeon Gold 6526Y (64 threads), 503 GB RAM, Debian 13, driver 550.163.01"
  host_pad: "laptop, 1x NVIDIA RTX 3050 (6 GB), Windows 11"
  analysis_stack: "Python 3.12.13, numpy 2.5.3, pandas 3.0.6, scipy 1.18.1, statsmodels 0.15.0"
  utility_digest: "phi4-mini Q4_K_M 3.8B, sha256:78fad5d182a7c33065e153a5f8ba2107 (L40S host; the padding stage ran on the laptop build)"
  macros_reproduced: 207   # re-running the analysis on the archived main run changed none of these
