# Zero-cost variant of the main design, judging phases on an NVIDIA L40S (46 GB) with Ollama.
# Same models, same run dir and cache as configs/ollama_local.yaml (only the server endpoint and
# the client concurrency differ; the cache key does not include the endpoint, so all work already
# done on the RTX 3050 host is reused).
#   bash scripts/serve_l40s.sh 8          # server on 127.0.0.1:11436, all 4 judges resident
#   ollama pull llama3.2:3b qwen2.5:3b gemma2:2b ministral-3:3b
#
# Exact builds used for the judging stages (also in runs/local/model_tags.json):
#   ministral-3:3b   Q4_K_M     3.8B  sha256:f04aa1c738f64e13c625b82ae92504fc
#   gemma2:2b        Q4_0       2.6B  sha256:8ccf136fdd5298f3ffe2d69862750ea7
#   qwen2.5:3b       Q4_K_M     3.1B  sha256:357c53fb659c5076de1d65ccb0b39744
#   llama3.2:3b      Q4_K_M     3.2B  sha256:a80c4f17acd55265feec403c7aef86be
run_name: local
out_dir: runs
seed: 2026

data:
  domains:
    literature:   {source: pubmedqa,      n: 25}
    clinical:     {source: medqa,         n: 25}
    pharmacology: {source: medmcqa_pharm, n: 25}
  distractor: hard

_ollama: &ol
  provider: openai
  base_url: http://127.0.0.1:11436/v1
  api_key_env: OLLAMA_API_KEY

models:
  llama:   {<<: *ol, model: "llama3.2:3b",    family: llama,   display: Llama-3.2-3B}
  qwen:    {<<: *ol, model: "qwen2.5:3b",     family: qwen,    display: Qwen2.5-3B}
  gemma:   {<<: *ol, model: "gemma2:2b",      family: gemma,   display: Gemma-2-2B, merge_system: true}
  mistral: {<<: *ol, model: "ministral-3:3b", family: mistral, display: Ministral-3-3B}
  phi:     {<<: *ol, model: "phi4-mini",      family: phi,     display: Phi-4-mini}

roles:
  generators: [llama, qwen, gemma, mistral]
  judges:     [llama, qwen, gemma, mistral]
  utility: phi

experiment:
  protocols: [base_raw, debias_raw, base_norm, debias_norm]
  attacks: [authority, citation, format, confidence, injection, combo]
  attack_pairs_per_item: 2
  pad_mode: llm
  pad_ratio: 2.5
  select: {enabled: true, protocols: [base_raw, debias_norm]}

runtime:
  concurrency: 48
  request_timeout: 300
  max_api_retries: 4
  interleave_models: true   # all 4 judges stay resident, so rotate them to keep every server busy

analysis:
  bootstrap: 2000
